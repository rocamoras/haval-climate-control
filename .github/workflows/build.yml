name: Build and Release

on:
  push:
    branches:
      - master
      - preview
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # O canal sai da branch, nao de um valor commitado: build.gradle.kts guarda
      # sempre a versao limpa, e a branch preview reescreve o versionName para
      # "<versao>-preview.<n>" so na hora de compilar. Como "-preview.N" ordena
      # ANTES de "<versao>" no semver, quem esta no preview cai sozinho no estavel
      # quando ele sai -- e nunca o contrario.
      - name: Get version from build.gradle.kts
        id: get_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BUILD_NUMBER=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          if [ "${{ github.ref_name }}" = "preview" ]; then
            # Contador proprio, sequencial por versao base e comecando em 2.
            # github.run_number e compartilhado com os builds do master, entao a
            # sequencia pularia (preview.7, depois preview.11) e nao diria nada a
            # quem testa. Aqui o proximo numero sai do maior prerelease ja publicado
            # para ESTA versao base; sem nenhum, comeca em 2.
            # grep -F casa string literal: os pontos da versao nao viram coringa,
            # que era o bug do escape manual (v1x22x1-preview.99 casava com 1.22.1).
            PREFIX="v${VERSION}-preview."
            LAST=$(gh release list --limit 100 --json tagName --jq ".[].tagName" \
                   | grep -F "$PREFIX" | sed "s|^${PREFIX}||" \
                   | grep -E "^[0-9]+$" | sort -n | tail -1)
            VERSION="${VERSION}-preview.$(( ${LAST:-1} + 1 ))"
            sed -i "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
            echo "CHANNEL=preview" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=stable" >> $GITHUB_OUTPUT
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (versionCode: $BUILD_NUMBER)"

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Fetch Frida 16.x injector (arm64) into res/raw
        run: |
          # Frida 17 removeu o bridge global `Java` (virou módulo externo). Usamos
          # 16.7.19 — scripts crus com Java.perform continuam funcionando.
          FV=16.7.19
          BASE="https://github.com/frida/frida/releases/download/${FV}"
          # So o frida-inject: com `-D local` ele injeta sozinho, sem frida-server.
          curl -fL -o fi.xz "${BASE}/frida-inject-${FV}-android-arm64.xz"
          xz -d fi.xz
          # Desliga a recarga da politica do SELinux. A cada start, o Frida le
          # /sys/fs/selinux/policy, acrescenta as regras dele e grava tudo de volta em
          # /sys/fs/selinux/load — um reload da politica inteira no meio do boot, que
          # derrubava o system_server (servicemanager devolvendo null para "alarm" e o
          # init recusando setprop durante o reload). frida_selinux_patch_policy() sai
          # calado quando o arquivo da politica nao existe, entao basta apontar os dois
          # caminhos para nomes inexistentes (mesmo tamanho, com o \0 junto para nao
          # pegar prefixo). A central roda permissive (setenforce 0 no FridaUtils), e o
          # setfilecon para frida_file que falha por falta do tipo e ignorado pelo Frida.
          perl -0777 -pi -e '$n = s{/sys/fs/selinux/policy\0}{/sys/fs/selinux/policX\0}g; $m = s{/sys/fs/selinux/load\0}{/sys/fs/selinux/loaX\0}g; die "patch SELinux: policy=$n load=$m (esperado 1 e 1)\n" unless $n == 1 && $m == 1' fi
          if grep -a -q -e '/sys/fs/selinux/policy' -e '/sys/fs/selinux/load' fi; then
            echo "patch SELinux nao pegou"; exit 1
          fi
          mv fi app/src/main/res/raw/fridainject
          chmod 644 app/src/main/res/raw/fridainject
          ls -la app/src/main/res/raw/fridainject

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Disparo manual: gera apenas um artifact com nome próprio, SEM criar tag/release
      # (assim não vira "latest" e o auto-update do app não é afetado).
      - name: Prepare dispatch APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          NAME="haval-climate-control-${{ steps.get_version.outputs.VERSION }}-build${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> $GITHUB_ENV

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: haval-climate-control-${{ steps.get_version.outputs.VERSION }}-build${{ github.run_number }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # Push em master/preview: publica a Release normalmente (fluxo de update real).
      # Na preview a release sai marcada como prerelease, e /releases/latest -- o
      # endpoint que o app estavel consulta -- por definicao NUNCA devolve um
      # prerelease. E essa flag, e nao o sufixo do nome, que esconde o build de
      # preview do canal estavel.
      - name: Create git tag and GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.get_version.outputs.VERSION }}"
          if [ "${{ steps.get_version.outputs.CHANNEL }}" = "preview" ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Create local tag (ignore error if it already exists)
          git tag "$TAG" 2>/dev/null || echo "Tag $TAG already exists locally"
          # Push tag to GitHub. Antes o erro ia para /dev/null e qualquer falha virava
          # "already pushed" — em 26/10 o push travou 21s por rede, a tag nunca chegou e
          # o erro que apareceu foi o do gh release create, um passo depois. Agora: se a
          # tag ja esta no remoto (re-run), pula; senao tenta 3 vezes com o erro visivel.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG ja esta no remoto"
          else
            for attempt in 1 2 3; do
              if git push origin "$TAG"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::error::push da tag $TAG falhou 3 vezes"
                exit 1
              fi
              echo "::warning::push da tag $TAG falhou (tentativa $attempt) — tentando de novo em $((attempt * 10))s"
              sleep $((attempt * 10))
            done
          fi
          # Create release, or just upload the APK if the release already exists
          gh release create "$TAG" $PRERELEASE \
            --title "haval-climate-control-${{ steps.get_version.outputs.VERSION }}" \
            --generate-notes \
            app/build/outputs/apk/release/app-release.apk \
          || gh release upload "$TAG" \
               app/build/outputs/apk/release/app-release.apk \
               --clobber
